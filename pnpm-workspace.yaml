# Security patches for transitive dependencies (CASA 6.1.1 - `pnpm audit --prod`
# must stay clean). Remove an entry once its parent package ships the fix.
overrides:
  # via @temporalio/* > @grpc/grpc-js (GHSA-m9gg-hp2v-232j, GHSA-f596-whhp-79r4)
  '@grpc/grpc-js@>=1.14.0 <1.14.5': ^1.14.5
  # via @temporalio/worker > webpack > schema-utils > ajv
  fast-uri@<3.1.7: ^3.1.7
  # via @prisma/client > prisma > @prisma/config
  deepmerge-ts@<8: ^8.0.2
patchedDependencies:
  '@kabosh-digital/m-street-kit@0.2.0': patches/@kabosh-digital__m-street-kit@0.2.0.patch
  '@kabosh-digital/workflow-schema@0.2.0': patches/@kabosh-digital__workflow-schema@0.2.0.patch
