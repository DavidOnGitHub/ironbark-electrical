name: Lockfile

# A dependency fix by the IT assistant (AI Builder) changes package.json and pnpm-workspace.yaml but cannot regenerate
# pnpm-lock.yaml: its sandbox has no network and no GitHub Packages token. CI installs with a frozen lockfile, so without
# this the pull request fails. This runs `pnpm install --lockfile-only` on the assistant's branch and pushes the lockfile.
#
# Safety: it only runs for branches of this repository that start with ai/, only when the whole change is limited to
# package.json, pnpm-workspace.yaml, pnpm-lock.yaml and specs (scripts/lockfile/scope.mjs), and it never runs install
# scripts. Needs the repo secret PACKAGES_READ_TOKEN, as CI does.
#
# It pushes with LOCKFILE_PUSH_TOKEN: a fine-grained personal access token limited to this repository with only
# Contents: read and write. A push made with the built-in token starts no pull-request checks, or starts them in a state
# that waits for someone to approve, so the pull request would stay blocked. A push by a person's token starts the
# normal CI at once. Without the secret the workflow does nothing and says so.

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - pnpm-workspace.yaml

concurrency:
  group: lockfile-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfile:
    if: startsWith(github.event.pull_request.head.ref, 'ai/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PUSH_TOKEN: ${{ secrets.LOCKFILE_PUSH_TOKEN }}
    steps:
      - name: Can it push?
        id: token
        run: |
          if [ -n "$PUSH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not regenerating the lockfile: the repository secret LOCKFILE_PUSH_TOKEN is not set."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.LOCKFILE_PUSH_TOKEN }}
      - name: Is this only a dependency change?
        id: scope
        if: steps.token.outputs.ok == 'true'
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | node scripts/lockfile/scope.mjs; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not regenerating the lockfile: the change goes beyond dependencies, so a person should look."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Let pnpm read the platform packages
        if: steps.scope.outputs.ok == 'true'
        run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_READ_TOKEN}" >> ~/.npmrc
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - name: Regenerate pnpm-lock.yaml
        if: steps.scope.outputs.ok == 'true'
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Push the lockfile
        if: steps.scope.outputs.ok == 'true'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "The lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm-lock.yaml"
          git push origin "HEAD:${HEAD_REF}"
