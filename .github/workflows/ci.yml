name: CI

# Proves a change is safe: lint, typecheck, test, build. Required on PRs into
# main and staging, so it also gates every change the IT assistant (AI Builder)
# opens. See PLAN-it-assistant.md in the platform repo.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Integration tests use a real database (their own schema, see test/globalSetup.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ironbark_electrical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ironbark_electrical?schema=public
      APP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ironbark_electrical?schema=ironbark-electrical
      # Tests must never start real automations or send mail.
      AUTOMATIONS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@kabosh-digital"
      - run: pnpm install --frozen-lockfile
        env:
          # The platform packages live in another GitHub owner, so the built-in
          # GITHUB_TOKEN cannot read them: a classic PAT with read:packages.
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
